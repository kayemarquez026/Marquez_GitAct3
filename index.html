<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 3 - Git Version Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #ffffff; 
            color: #2d2d2d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border: 3px solid #2d2d2d;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 6px 6px 0px #2d2d2d;
        }
        .badge {
            display: inline-block;
            background-color: #f0f0f0; 
            color: #2d2d2d;
            border: 1.5px solid #2d2d2d;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        h1 {
            color: #2d2d2d;
            font-size: 1.3rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        hr {
            border: none;
            border-top: 2px dashed #2d2d2d;
            margin: 18px 0;
            opacity: 0.5;
        }
        p {
            color: #4a4a4a;
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">GIT REPOSITORY</span>
        <h1>[ Activity #3 ]</h1>
        <hr>
        <p>Welcome! This is my first HTML file, managed with Git version control.</p>
    </div>
</body>
</html>
